  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:.8rem 1.1rem;border-radius:.85rem;z-index:70;font-size:.82rem;max-width:88vw;box-shadow:0 10px 30px rgba(0,0,0,.4);}

  .tabbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem;border-radius:.7rem;font-size:.72rem;font-weight:600;color:var(--sub);cursor:pointer;background:none;border:none;}

  .chart{display:flex;align-items:flex-end;gap:.45rem;height:120px;}
  .chart-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.3rem;}
  .chart-bar{width:100%;background:var(--gold);border-radius:.35rem .35rem 0 0;min-height:2px;transition:height .4s ease;}
  .chart-label{font-size:.62rem;color:var(--sub);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;}
  .grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;}
  .field label{font-size:.68rem;font-weight:600;color:var(--sub);letter-spacing:.02em;display:block;margin-bottom:.3rem;}
  .stat-box{background:var(--surface2);border-radius:.8rem;padding:.7rem .8rem;}
  .link-btn{background:none;border:none;color:var(--gold);font-size:.8rem;font-weight:600;cursor:pointer;padding:0;}
  .icon-btn{width:2.3rem;height:2.3rem;border-radius:999px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--sub);}

function todayKey(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");

/* =========================================================
   STORAGE  (Claude artifact -> window.storage, standalone browser -> localStorage)
========================================================= */
const HAS_CLAUDE_STORAGE = (typeof window !== "undefined") && !!window.storage;
async function loadData(key, fallback){
  try{
    if(HAS_CLAUDE_STORAGE){
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : fallback;
    } else {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    }
  }catch(e){ return fallback; }
}
async function saveData(key, value){
  try{
    if(HAS_CLAUDE_STORAGE){ await window.storage.set(key, JSON.stringify(value)); }
    else{ localStorage.setItem(key, JSON.stringify(value)); }
  }catch(e){ console.error("save failed", e); }
}

/* =========================================================
   NOTIFICATIONS
========================================================= */
function showToast(title, body){
  STATE.toast = { title, body };
  render();
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ STATE.toast=null; render(); }, 6000);
}
function notify(title, body){
  try{
    if("Notification" in window && Notification.permission === "granted"){
      new Notification(title, { body });
      return;
    }
  }catch(e){}
  showToast(title, body);
}
function requestNotifPermission(){
  if(!("Notification" in window)){
    showToast("Notifications unsupported", "This browser/preview doesn't support push notifications — in-app alerts will be used instead.");
    return;
  }
  Notification.requestPermission().then(perm=>{
    if(perm === "granted") showToast("Notifications enabled", "You'll now get prayer & check-in alerts.");
    else showToast("Notifications blocked", "Enable notifications in your browser settings, or rely on in-app alerts.");
  }).catch(()=> showToast("Notifications unavailable", "Falling back to in-app alerts in this environment."));
}
function sendTestNotification(){ notify("Test Notification 🔔", "This is what your reminders will look like."); }

function checkPrayerTimes(){
  const p = STATE.profile;
  if(!p || p.religionPractice !== "prayers" || !p.prayerTimes) return;
  const now = new Date();
  const cur = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const dateKey = todayKey(now);
  PRAYERS.forEach(pr=>{
    if(p.prayerTimes[pr.id] === cur){
      const guard = `${dateKey}-${pr.id}`;
      if(!STATE.notifiedMinutes[guard]){
        STATE.notifiedMinutes[guard] = true;
        notify(`${pr.label} time 🕌`, `It's time for ${pr.label} prayer.`);
      }
    }
  });
}
function scheduleNextCheckin(){
  STATE.profile.nextCheckinAt = Date.now() + (1 + Math.random()*2) * 3600 * 1000;
  persistProfile();
}
function checkRandomCheckin(){
  const p = STATE.profile;
  if(!p || !p.checkinEnabled) return;
  if(!p.nextCheckinAt){ scheduleNextCheckin(); return; }
  if(Date.now() >= p.nextCheckinAt){
    notify("Quick check-in ✨", "What are you doing right now?");
    STATE.showCheckin = true;
    scheduleNextCheckin();
    render();
  }
}
function startTimers(){
  setInterval(()=>{ checkPrayerTimes(); checkRandomCheckin(); }, 30000);
}

const app = document.getElementById("app");
function render(){
  if(!STATE.loaded){
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--sub);">Loading…</div>`;
    return;
  }
  let html = "";
  if(!STATE.profile){
    html = renderOnboarding();
  } else {
    html = renderDashboard();
  }
  if(STATE.toast){
    html += `<div class="toast"><div class="ttitle">${esc(STATE.toast.title)}</div><div>${esc(STATE.toast.body)}</div></div>`;
  }
  if(STATE.showCheckin && STATE.profile){
    html += renderCheckinModal();
  }
  if(STATE.showSettings && STATE.profile){
    html += renderSettingsModal();
  }
  app.innerHTML = html;
}

const ONBOARD_STEPS = ["Welcome","About You","Beliefs","Your Goals","Future Self"];
function religionObj(){ return RELIGIONS.find(r=>r.id===STATE.draft.religion); }

function onboardCanNext(step){
  const d = STATE.draft;
  if(step===1) return d.name.trim() && d.age && d.weight;
  if(step===2) return !!d.religion;
  if(step===3) return d.goals.length>0
    && (!d.goals.includes("habit") || d.habitName.trim())
    && (!d.goals.includes("savings") || (d.savingsGoalName.trim() && d.savingsTarget));
  if(step===4) return d.career==="Other" ? d.customCareer.trim() : !!d.career;
  return true;
}

/* =========================================================
   DASHBOARD
========================================================= */
function computeTasks(){
  const p = STATE.profile, log = getLog(todayKey());
  const t = [];
  if(p.goals.includes("habit")) t.push({id:"habit_ok", done:true, skip:true});
  if(p.goals.includes("spiritual")){
    if(p.religionPractice==="prayers") t.push({id:"prayers", done: PRAYERS.every(pr=>log.prayers?.[pr.id])});
    else t.push({id:"spiritual", done: !!log.spiritual});
  }
  if(p.goals.includes("exercise")) t.push({id:"exercise", done: !!log.exerciseDone});
  if(p.goals.includes("reading")) t.push({id:"reading", done: !!log.reading});
  if(p.goals.includes("writing")) t.push({id:"writing", done: !!log.writing});
  if(p.goals.includes("water")) t.push({id:"water", done: (log.water||0)>=8});
  if(p.goals.includes("sleep")) t.push({id:"sleep", done: !!log.sleep});
  return t;
}

function weeklyPct(){
  const p = STATE.profile;
  const arr = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = todayKey(d); const l = getLog(key);
    let total=0, done=0;
    if(p.goals.includes("spiritual")){ total++; if(p.religionPractice==="prayers"){ if(PRAYERS.every(pr=>l.prayers?.[pr.id])) done++; } else if(l.spiritual) done++; }
    if(p.goals.includes("exercise")){ total++; if(l.exerciseDone) done++; }
    if(p.goals.includes("reading")){ total++; if(l.reading) done++; }
    if(p.goals.includes("writing")){ total++; if(l.writing) done++; }
    if(p.goals.includes("water")){ total++; if((l.water||0)>=8) done++; }
    if(p.goals.includes("sleep")){ total++; if(l.sleep) done++; }
    arr.push({ day: dayLabel(key), pct: total ? Math.round((done/total)*100) : 0 });
  }
  return arr;
}

function sunriseArcSvg(pct){
  const r=70, c=2*Math.PI*r, dash = c*Math.min(1,pct);
  const angle = Math.PI * Math.min(1,pct);
  const cx = 20 + 140*Math.min(1,pct), cy = 100 - Math.sin(angle)*70;
  return `
  <div style="position:relative;display:flex;flex-direction:column;align-items:center;padding:1rem 0;">
    <svg width="180" height="110" viewBox="0 0 180 110">
      <path d="M 20 100 A 70 70 0 0 1 160 100" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
      <path d="M 20 100 A 70 70 0 0 1 160 100" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${dash} ${c}" style="transition:stroke-dasharray .6s ease"/>
      ${pct>0 ? `<circle cx="${cx}" cy="${cy}" r="7" fill="var(--goldhi)"/>` : ""}
    </svg>
    <div style="position:absolute;top:2.9rem;display:flex;flex-direction:column;align-items:center;width:100%;">
      <div class="serif fw-700" style="font-size:1.8rem;">${Math.round(pct*100)}%</div>
      <div class="text-xs sub" style="letter-spacing:.05em;">TODAY'S PROGRESS</div>
    </div>
  </div>`;
}

function chartHtml(data, formatFn){
  const max = Math.max(1, ...data.map(x=>x.val));
  return `<div class="chart">
    ${data.map(x=>`
      <div class="chart-wrap">
        <div class="chart-bar" style="height:${Math.max(2,(x.val/max)*100)}%;" title="${formatFn?formatFn(x.val):x.val}"></div>
        <div class="chart-label">${esc(x.day)}</div>
      </div>`).join("")}
  </div>`;
}

function habitStreakDays(){
  const p = STATE.profile;
  const start = new Date((p.lastRelapseDate || p.habitStartDate) + "T00:00:00");
  const now = new Date(todayKey() + "T00:00:00");
  return Math.max(0, Math.round((now-start)/86400000));
}

function renderMilestoneBar(days){
  const ms = [3,7,14,30,60,90];
  const next = ms.find(m=>m>days) ?? ms[ms.length-1];
  const prev = [...ms].reverse().find(m=>m<=days) ?? 0;
  const pct = Math.min(1, (days-prev)/((next-prev)||1));
  return `
    <div class="mt-3">
      <div class="row between text-xs sub mb-1"><span>${prev}d</span><span>Next milestone: ${next}d</span></div>
      <div class="progress-track thin"><div class="progress-fill" style="width:${pct*100}%;background:var(--green);"></div></div>
    </div>`;
}

function renderHome(){
  const p = STATE.profile, log = getLog(todayKey());
  const tasks = computeTasks();
  const trackable = tasks.filter(t=>!t.skip);
  const pct = trackable.length ? trackable.filter(t=>t.done).length/trackable.length : 0;
  const quote = QUOTES[new Date().getDate() % QUOTES.length];

  let out = `<div class="card">${sunriseArcSvg(pct)}
    <div class="row center gap-2" style="text-align:center;">${icon("sparkles","var(--gold)",13)}<p class="text-xs sub" style="font-style:italic;margin:0;">${esc(quote)}</p></div>
  </div>`;

  // Habit streak
  if(p.goals.includes("habit")){
    const days = habitStreakDays();
    out += `<div class="card">
      <div class="row between">
        <div class="row gap-3">
          <div style="background:var(--surface2);padding:.6rem;border-radius:.8rem;">${icon("flame","var(--gold)",22)}</div>
          <div>
            <div class="text-xs sub">STREAK — ${esc(p.habitName)}</div>
            <div class="serif fw-700 text-2xl">${days} ${days===1?"day":"days"}</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" data-action="relapse">${icon("rotate","var(--sub)",14)}&nbsp;Reset</button>
      </div>
      ${renderMilestoneBar(days)}
    </div>`;
  }

  // Spiritual / prayers
  if(p.goals.includes("spiritual")){
    out += `<div class="card">
      <div class="row gap-2">${icon("sunrise","var(--gold)",16)}<h3 class="fw-600 text-sm">${esc(p.religionPracticeLabel)}</h3></div>`;
    if(p.religionPractice==="prayers"){
      out += `<div class="grid-5 mt-2">
        ${PRAYERS.map(pr=>{
          const done = !!log.prayers?.[pr.id];
          return `<button class="flex-col center gap-1" data-action="toggle-prayer" data-id="${pr.id}" style="padding:.75rem 0;border-radius:.8rem;background:${done?"var(--surface2)":"transparent"};border:1px solid ${done?"var(--gold)":"var(--line)"};">
            ${done ? icon("check","var(--green)",17) : `<span class="dot" style="width:17px;height:17px;"></span>`}
            <span class="text-xs" style="font-size:.68rem;">${pr.label}</span>
          </button>`;
        }).join("")}
      </div>`;
    } else {
      out += `<button class="check-row" data-action="toggle-spiritual">
        <span class="dot ${log.spiritual?"done":""}"></span>
        <span class="text-sm fw-600" style="${log.spiritual?"text-decoration:line-through;opacity:.6;":""}">${esc(p.religionPracticeLabel)}</span>
      </button>`;
    }
    out += `</div>`;
  }

  // Exercise
  if(p.goals.includes("exercise")){
    const count = log.exerciseCount || 0, target = p.pushupTarget || 10;
    out += `<div class="card">
      <div class="row gap-2">${icon("dumbbell","var(--gold)",16)}<h3 class="fw-600 text-sm">Exercise</h3></div>
      <div class="row between mt-1">
        <div class="serif fw-700 text-2xl">${count} <span class="text-sm sub" style="font-weight:400;">/ ${target} pushups</span></div>
        <div class="row gap-2">
          <button class="btn btn-ghost btn-sm" data-action="exercise-dec">-5</button>
          <button class="btn btn-primary btn-sm" data-action="exercise-inc">+5</button>
        </div>
      </div>
      <div class="progress-track mt-3"><div class="progress-fill" style="width:${Math.min(100,(count/target)*100)}%;"></div></div>
    </div>`;
  }

  // Daily practice (reading/writing/sleep/water)
  if(p.goals.includes("reading")||p.goals.includes("writing")||p.goals.includes("water")||p.goals.includes("sleep")){
    out += `<div class="card">
      <div class="row gap-2">${icon("target","var(--gold)",16)}<h3 class="fw-600 text-sm">Daily Practice</h3></div>
      <div class="divide mt-1">`;
    if(p.goals.includes("reading")) out += `<button class="check-row" data-action="toggle-reading"><span class="dot ${log.reading?"done":""}"></span><span class="flex-1"><div class="text-sm fw-600" style="${log.reading?"text-decoration:line-through;opacity:.6;":""}">Read today</div><div class="text-xs sub">Even 10 pages counts</div></span></button>`;
    if(p.goals.includes("writing")) out += `<button class="check-row" data-action="toggle-writing"><span class="dot ${log.writing?"done":""}"></span><span class="flex-1"><div class="text-sm fw-600" style="${log.writing?"text-decoration:line-through;opacity:.6;":""}">Write / journal today</div><div class="text-xs sub">A few honest sentences</div></span></button>`;
    if(p.goals.includes("sleep")) out += `<div class="row between" style="padding:.6rem 0;"><div><div class="text-sm fw-600">Sleep</div><div class="text-xs sub">${log.sleepDurationMin ? `Logged ${hm(log.sleepDurationMin)} last night` : "Tracked in the Sleep tab"}</div></div>${log.sleep ? icon("check","var(--green)",18) : icon("moon","var(--sub)",16)}</div>`;
    if(p.goals.includes("water")){
      const w = log.water||0;
      out += `<div style="padding:.6rem 0;">
        <div class="row between mb-2"><span class="text-sm fw-600">Water — ${w} / 8 glasses</span></div>
        <div class="row gap-2">${Array.from({length:8}).map((_,i)=>`<div class="water-cell ${i<w?"filled":""}" data-action="water-set" data-id="${i+1===w? i : i+1}"></div>`).join("")}</div>
      </div>`;
    }
    out += `</div></div>`;
  }

  // Weekly chart
  out += `<div class="card">
    <div class="row gap-2">${icon("award","var(--gold)",16)}<h3 class="fw-600 text-sm">This Week</h3></div>
    ${chartHtml(weeklyPct().map(x=>({day:x.day, val:x.pct})), v=>v+"%")}
  </div>`;

  // Savings
  if(p.goals.includes("savings")){
    const curMonth = monthKeyOf();
    const monthlySavings = (p.monthlyIncome||0)-(p.monthlyExpenses||0);
    const cur = p.savingsCurrent||0, tgt = p.savingsTarget||0;
    const remaining = Math.max(0, tgt-cur);
    const monthsRemaining = monthlySavings>0 ? Math.ceil(remaining/monthlySavings) : null;
    const projected = monthsRemaining!=null ? new Date(new Date().setMonth(new Date().getMonth()+monthsRemaining)).toLocaleDateString(undefined,{month:"short",year:"numeric"}) : null;
    const loggedThisMonth = p.savingsLog?.[curMonth];
    out += `<div class="card">
      <div class="row between">
        <div class="row gap-2">${icon("piggy","var(--gold)",18)}<h3 class="fw-600 text-sm">Saving for: ${esc(p.savingsGoalName)}</h3></div>
        ${icon("award", monthlySavings>0?"var(--green)":"var(--red)", 16)}
      </div>
      <div class="row between mt-3" style="align-items:flex-end;">
        <span class="serif fw-700 text-2xl">${fmtMoney(cur,p.currency)}</span>
        <span class="text-sm sub">of ${fmtMoney(tgt,p.currency)}</span>
      </div>
      <div class="progress-track mt-1"><div class="progress-fill" style="width:${Math.min(100,(cur/(tgt||1))*100)}%;"></div></div>
      <div class="grid-2 mt-3">
        <div class="stat-box">
          <div class="text-xs sub">MONTHLY BUDGET</div>
          <div class="text-sm fw-700 mt-1" style="color:${monthlySavings>=0?"var(--green)":"var(--red)"};">${monthlySavings>=0?"+":""}${fmtMoney(monthlySavings,p.currency)}/mo</div>
          <div class="text-xs sub mt-1">${fmtMoney(p.monthlyIncome,p.currency)} in − ${fmtMoney(p.monthlyExpenses,p.currency)} out</div>
        </div>
        <div class="stat-box">
          <div class="text-xs sub">TIME TO GOAL</div>
          <div class="text-sm fw-700 mt-1">${monthlySavings<=0 ? "Adjust budget" : remaining===0 ? "Reached! 🎉" : `${monthsRemaining} mo · ${projected}`}</div>
        </div>
      </div>
      <div class="mt-4">
        <div class="text-xs sub mb-2">${loggedThisMonth ? `You've logged ${fmtMoney(p.savingsLog[curMonth],p.currency)} for ${monthLabel(curMonth)}` : `Log this month's savings (${monthLabel(curMonth)})`}</div>
        <button class="btn btn-primary" data-action="savings-add-budgeted" ${monthlySavings<=0?"disabled":""}>${icon("wallet","#1A1000",14)}&nbsp;Add budgeted ${fmtMoney(monthlySavings,p.currency)}</button>
        <div class="row gap-2 mt-2">
          <input type="number" min="0" id="savings-custom-amount" placeholder="Custom amount" style="flex:1;"/>
          <button class="btn btn-ghost" data-action="savings-add-custom">${icon("plus","var(--sub)",14)}&nbsp;Add</button>
        </div>
      </div>
    </div>`;
  }

  // Random check-ins
  const checkins = (STATE.logs.checkins || []).slice(-5).reverse();
  out += `<div class="card">
    <div class="row between">
      <div class="row gap-2">${icon("bell","var(--gold)",16)}<h3 class="fw-600 text-sm">Random Check-ins</h3></div>
      <button class="link-btn" data-action="open-checkin">+ Add</button>
    </div>
    <div class="flex-col gap-2 mt-2">
      ${checkins.length===0 ? `<div class="text-xs sub">No check-ins logged yet. Enable check-in reminders in Settings, or add one manually.</div>` :
        checkins.map(c=>`<div class="row between text-sm" style="padding:.35rem 0;"><span>${esc(c.text)}</span><span class="text-xs sub">${new Date(c.timestamp).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</span></div>`).join("")}
    </div>
  </div>`;

  // Career roadmap
  const roadmap = CAREERS[p.careerGoal] || genericRoadmap(p.careerGoal);
  const roadmapTotal = roadmap.reduce((s,st)=>s+st.items.length,0);
  const roadmapDone = Object.values(p.roadmapProgress||{}).filter(Boolean).length;
  out += `<div class="card">
    <button class="row between btn-block" data-action="toggle-roadmap" style="background:none;border:none;color:inherit;padding:0;cursor:pointer;">
      <div class="row gap-2">${icon("compass","var(--gold)",16)}<h3 class="fw-600 text-sm">Roadmap · ${esc(p.careerGoal)}</h3></div>
      <span style="display:inline-flex;transform:rotate(${STATE.showRoadmap?90:0}deg);transition:transform .2s;">${icon("chevron","var(--sub)",18)}</span>
    </button>
    <div class="progress-track mt-3 mb-1"><div class="progress-fill" style="width:${(roadmapDone/roadmapTotal)*100}%;background:var(--green);"></div></div>
    <div class="text-xs sub mb-1">${roadmapDone} / ${roadmapTotal} steps complete</div>
    ${STATE.showRoadmap ? `<div class="flex-col gap-4 mt-3">
      ${roadmap.map((stage,si)=>`
        <div>
          <div class="row gap-2 mb-1">${icon("mappin","var(--gold)",14)}<span class="text-sm fw-600">${esc(stage.title)}</span></div>
          <div class="flex-col" style="border-left:1px solid var(--line);padding-left:1.1rem;">
            ${stage.items.map((item,ii)=>{

            }).join("")}
          </div>
        </div>`).join("")}
    </div>` : ""}
  </div>`;

  return out;
}

/* -------- Sleep Tab -------- */
function renderSleep(){
  const p = STATE.profile;
  const isAsleep = p.sleepStatus === "asleep";
  const targetHours = p.sleepTargetHours || 8;
  const targetMin = targetHours*60;
  const sessions = p.sleepSessions || [];
  const recent = [...sessions].slice(-7).reverse();
  const chartData = [...sessions].slice(-7).map(s=>({day:dayLabel(s.date), val:+(s.durationMin/60).toFixed(1)}));
  const avgMin = recent.length ? Math.round(recent.reduce((a,s)=>a+s.durationMin,0)/recent.length) : 0;

  let elapsedMin = 0;
  if(isAsleep){ elapsedMin = Math.max(0, Math.round((Date.now()-new Date(p.sleepStartedAt).getTime())/60000)); }

  let out = `<div class="card">
    <div class="flex-col center gap-3" style="text-align:center;padding:1rem 0;">
      ${icon(isAsleep?"moon":"sun","var(--gold)",40)}
      ${isAsleep ? `
        <div class="text-sm sub">Sleeping since ${new Date(p.sleepStartedAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</div>
        <div class="serif fw-700 text-3xl">${hm(elapsedMin)}</div>
        <button class="btn btn-primary" data-action="sleep-wake">${icon("sun","#1A1000",16)}&nbsp;I Just Woke Up</button>
      ` : `
        <div class="text-sm sub">Ready to wind down?</div>
        <button class="btn btn-primary" data-action="sleep-go">${icon("moon","#1A1000",16)}&nbsp;I'm Going to Sleep</button>
      `}
    </div>
  </div>`;

  out += `<div class="card">
    <div class="row gap-2">${icon("target","var(--gold)",16)}<h3 class="fw-600 text-sm">Sleep Target</h3></div>
    <div class="row gap-3 mt-2">
      <input type="number" min="4" max="12" id="sleep-target-input" value="${targetHours}" style="width:5rem;" data-action-onchange="sleep-target"/>
      <span class="text-sm sub">hours / night</span>
    </div>
  </div>`;

  if(chartData.length>0){
    out += `<div class="card">
      <div class="row gap-2">${icon("award","var(--gold)",16)}<h3 class="fw-600 text-sm">Last 7 Nights</h3></div>
      ${chartHtml(chartData, v=>v+"h")}
      <div class="text-xs sub mt-2">Average: ${hm(avgMin)} · Target: ${targetHours}h</div>
    </div>`;
  }

  if(recent.length>0){
    out += `<div class="card">
      <div class="row gap-2">${icon("moon","var(--gold)",16)}<h3 class="fw-600 text-sm">History</h3></div>
      <div class="divide mt-2">
        ${recent.map(s=>`
          <div class="row between text-sm" style="padding:.6rem 0;">
            <span>${monthLabel(s.date.slice(0,7))} ${s.date.slice(8,10)}</span>
            <span class="sub text-xs">${new Date(s.start).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})} → ${new Date(s.end).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</span>
            <span class="fw-700" style="color:${s.durationMin>=targetMin?"var(--green)":"var(--gold)"};">${hm(s.durationMin)}</span>
          </div>`).join("")}
      </div>
    </div>`;
  }

  if(sessions.length===0){
    out += `<div class="card"><p class="text-sm sub" style="text-align:center;padding:1rem 0;">No sleep logged yet. Tap "I'm Going to Sleep" tonight, then "I Just Woke Up" tomorrow to start your history.</p></div>`;
  }
  return out;
}

/* -------- Looksmaxing Tab -------- */
function renderLooks(){
  const log = getLog(todayKey());
  const looks = log.looks || {};
  const done = LOOKS_TASKS.filter(t=>looks[t.id]).length;
  const pct = done/LOOKS_TASKS.length;

  const weekData = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = todayKey(d); const l = getLog(key).looks || {};
    const c = LOOKS_TASKS.filter(t=>l[t.id]).length;
    weekData.push({day:dayLabel(key), val:Math.round((c/LOOKS_TASKS.length)*100)});
  }

  return `
    <div class="card">
      <div class="row gap-3">
        ${icon("sparkles","var(--gold)",22)}
        <div>
          <div class="serif fw-700 text-lg">Looksmaxing</div>
          <div class="text-xs sub">The fundamentals: skin, hair, posture, fitness, hygiene, confidence — done consistently.</div>
        </div>
      </div>
      <div class="progress-track mt-4"><div class="progress-fill" style="width:${pct*100}%;"></div></div>
      <div class="text-xs sub mt-1">${done} / ${LOOKS_TASKS.length} done today</div>
    </div>
    <div class="card">
      <div class="row gap-2">${icon("check","var(--gold)",16)}<h3 class="fw-600 text-sm">Today's Checklist</h3></div>
      <div class="divide mt-1">
        ${LOOKS_TASKS.map(t=>`<button class="check-row" data-action="toggle-look" data-id="${t.id}"><span class="dot ${looks[t.id]?"done":""}"></span><span class="text-sm" style="${looks[t.id]?"text-decoration:line-through;opacity:.6;":""}">${esc(t.label)}</span></button>`).join("")}
      </div>
    </div>
    <div class="card">
      <div class="row gap-2">${icon("award","var(--gold)",16)}<h3 class="fw-600 text-sm">This Week</h3></div>
      ${chartHtml(weekData, v=>v+"%")}
    </div>
    <div class="card">
      <div class="row gap-2">${icon("star","var(--gold)",16)}<h3 class="fw-600 text-sm">Tips</h3></div>
      <div class="flex-col gap-2 mt-2">
        ${LOOKS_TIPS.map(tip=>`<div class="row gap-3" style="align-items:flex-start;"><div style="width:6px;height:6px;border-radius:999px;background:var(--gold);margin-top:.4rem;flex-shrink:0;"></div><p class="text-sm sub" style="margin:0;">${esc(tip)}</p></div>`).join("")}
      </div>
    </div>`;
}

/* =========================================================
   ACTIONS
========================================================= */
function handleAction(action, id, el){
  const d = STATE.draft;
  switch(action){
    /* onboarding */
    case "select-religion": d.religion = id; render(); break;
    case "toggle-goal": d.goals = d.goals.includes(id) ? d.goals.filter(g=>g!==id) : [...d.goals, id]; render(); break;
    case "select-career": d.career = id; render(); break;
    case "onboard-back": STATE.onboardStep = Math.max(0, STATE.onboardStep-1); render(); break;
    case "onboard-next": if(onboardCanNext(STATE.onboardStep)) STATE.onboardStep++; render(); break;
    case "onboard-finish": finishOnboarding(); break;

    /* tabs / settings / modals */
    case "set-tab": STATE.tab = id; render(); break;
    case "open-settings": STATE.settingsDraft = null; STATE.showSettings = true; render(); break;
    case "close-settings": case "close-settings-overlay": STATE.showSettings = false; STATE.settingsDraft = null; render(); break;
    case "save-settings": saveSettings(); break;
    case "open-checkin": STATE.showCheckin = true; render(); break;
    case "close-checkin": case "close-checkin-overlay": STATE.showCheckin = false; render(); break;
    case "log-checkin": logCheckin(); break;
    case "toggle-sdraft-checkin": STATE.settingsDraft.checkinEnabled = !STATE.settingsDraft.checkinEnabled; render(); break;
    case "enable-notifications": requestNotifPermission(); break;
    case "test-notification": sendTestNotification(); break;

    /* home tab */
    case "relapse": STATE.profile.lastRelapseDate = todayKey(); persistProfile(); render(); break;
    case "toggle-prayer": {
      const log = getLog(todayKey());
      const prayers = { ...(log.prayers||{}), [id]: !(log.prayers?.[id]) };
      updateLog(todayKey(), { prayers }); render(); break;
    }
    case "toggle-spiritual": { const log = getLog(todayKey()); updateLog(todayKey(), { spiritual: !log.spiritual }); render(); break; }
    case "exercise-inc": case "exercise-dec": {
      const log = getLog(todayKey());
      const delta = action==="exercise-inc" ? 5 : -5;
      const c = Math.max(0, (log.exerciseCount||0) + delta);
      updateLog(todayKey(), { exerciseCount:c, exerciseDone: c >= (STATE.profile.pushupTarget||10) });
      render(); break;
    }
    case "toggle-reading": { const log = getLog(todayKey()); updateLog(todayKey(), { reading: !log.reading }); render(); break; }
    case "toggle-writing": { const log = getLog(todayKey()); updateLog(todayKey(), { writing: !log.writing }); render(); break; }
    case "water-set": { updateLog(todayKey(), { water: Number(id) }); render(); break; }
    case "toggle-roadmap": STATE.showRoadmap = !STATE.showRoadmap; render(); break;
    case "toggle-roadmap-step": {
      const rp = { ...(STATE.profile.roadmapProgress||{}) };
      rp[id] = !rp[id];
      STATE.profile.roadmapProgress = rp; persistProfile(); render(); break;
    }
    case "savings-add-budgeted": {
      const monthlySavings = (STATE.profile.monthlyIncome||0)-(STATE.profile.monthlyExpenses||0);
      if(monthlySavings>0) addSavingsContribution(monthlySavings);
      break;
    }
    case "savings-add-custom": {
      const inp = document.getElementById("savings-custom-amount");
      const amount = Number(inp && inp.value);
      if(amount>0) addSavingsContribution(amount);
      break;
    }

    /* sleep tab */
    case "sleep-go": STATE.profile.sleepStatus="asleep"; STATE.profile.sleepStartedAt=new Date().toISOString(); persistProfile(); render(); break;
    case "sleep-wake": wakeUp(); break;

    /* looksmaxing */
    case "toggle-look": {
      const log = getLog(todayKey());
      const looks = { ...(log.looks||{}), [id]: !(log.looks?.[id]) };
      updateLog(todayKey(), { looks }); render(); break;
    }
  }
}

function finishOnboarding(){
  const d = STATE.draft;
  const rObj = religionObj();
  const finalCareer = d.career==="Other" ? d.customCareer.trim() : d.career;
  const finalGoals = [...d.goals];
  if(rObj?.practice && !finalGoals.includes("spiritual")) finalGoals.push("spiritual");

  STATE.profile = {
    id: uid(), name: d.name.trim(), age: Number(d.age), weight: Number(d.weight), weightUnit: d.weightUnit,
    religion: d.religion, religionPractice: rObj?.practice || null, religionPracticeLabel: rObj?.practiceLabel || null,
    goals: finalGoals, habitName: d.habitName.trim() || "Bad Habit", pushupTarget: Number(d.pushupTarget) || 10,
    careerGoal: finalCareer, lastRelapseDate: todayKey(), habitStartDate: todayKey(),
    roadmapProgress: {}, createdAt: todayKey(),
    savingsGoalName: d.savingsGoalName.trim(), savingsTarget: Number(d.savingsTarget)||0,
    savingsCurrent: Number(d.savingsCurrent)||0, monthlyIncome: Number(d.monthlyIncome)||0,
    monthlyExpenses: Number(d.monthlyExpenses)||0, currency: d.currency, savingsLog: {},
    sleepStatus: "awake", sleepStartedAt: null, sleepSessions: [], sleepTargetHours: 8,
    prayerTimes: { ...DEFAULT_PRAYER_TIMES }, checkinEnabled: false, nextCheckinAt: null,
  };
  persistProfile();
  render();
}

function saveSettings(){
  const sd = STATE.settingsDraft;
  const p = STATE.profile;
  p.name = sd.name.trim() || p.name;
  p.age = Number(sd.age)||p.age;
  p.weight = Number(sd.weight)||p.weight;
  p.pushupTarget = Number(sd.pushupTarget)||p.pushupTarget;
  p.habitName = sd.habitName?.trim() || p.habitName;
  p.careerGoal = sd.careerGoal;
  if(p.goals.includes("savings")){
    p.savingsGoalName = sd.savingsGoalName.trim();
    p.savingsTarget = Number(sd.savingsTarget)||0;
    p.savingsCurrent = Number(sd.savingsCurrent)||0;
    p.monthlyIncome = Number(sd.monthlyIncome)||0;
    p.monthlyExpenses = Number(sd.monthlyExpenses)||0;
    p.currency = sd.currency;
  }
  if(p.religionPractice==="prayers"){ p.prayerTimes = { ...sd.prayerTimes }; }
  p.checkinEnabled = !!sd.checkinEnabled;
  if(p.checkinEnabled && !p.nextCheckinAt) scheduleNextCheckin();
  persistProfile();
  STATE.showSettings = false;
  STATE.settingsDraft = null;
  render();
}

function addSavingsContribution(amount){
  const p = STATE.profile;
  const curMonth = monthKeyOf();
  p.savingsCurrent = (p.savingsCurrent||0) + amount;
  p.savingsLog = { ...(p.savingsLog||{}), [curMonth]: (p.savingsLog?.[curMonth]||0) + amount };
  persistProfile();
  render();
}

function wakeUp(){
  const p = STATE.profile;
  const start = new Date(p.sleepStartedAt), end = new Date();
  const durationMin = Math.max(1, Math.round((end-start)/60000));
  const wakeDate = todayKey(end);
  p.sleepSessions = [...(p.sleepSessions||[]), { start:start.toISOString(), end:end.toISOString(), durationMin, date:wakeDate }].slice(-30);
  p.sleepStatus = "awake"; p.sleepStartedAt = null;
  persistProfile();
  const targetMin = (p.sleepTargetHours||8)*60;
  updateLog(wakeDate, { sleepDurationMin: durationMin, sleep: durationMin>=targetMin });
  render();
}

function logCheckin(){
  const textEl = document.getElementById("checkin-text");
  const text = (textEl && textEl.value.trim()) || "";
  if(text){
    STATE.logs.checkins = [...(STATE.logs.checkins||[]), { timestamp:new Date().toISOString(), text }];
    persistLogs();
  }
  STATE.showCheckin = false;
  render();
}

/* =========================================================
   EVENT DELEGATION  (fixes: reliable across re-renders, no stale onclick)
========================================================= */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  handleAction(el.dataset.action, el.dataset.id, el);
});

document.addEventListener("input", (e)=>{
  const el = e.target;
  if(el.dataset && el.dataset.draft !== undefined){
    STATE.draft[el.dataset.draft] = el.value;
  }
  if(el.dataset && el.dataset.sdraft !== undefined && STATE.settingsDraft){
    STATE.settingsDraft[el.dataset.sdraft] = el.value;
  }
  if(el.dataset && el.dataset.sdraftPrayer !== undefined && STATE.settingsDraft){
    STATE.settingsDraft.prayerTimes[el.dataset.sdraftPrayer] = el.value;
  }
  if(el.id === "sleep-target-input"){
    const v = Number(el.value)||8;
    STATE.profile.sleepTargetHours = v;
    persistProfile();
  }
});

/* =========================================================
   INIT
========================================================= */
(async function init(){
  STATE.profile = await loadData("profile", null);
  STATE.logs = await loadData("logs", {});
  STATE.loaded = true;
  render();
  startTimers();
})();
</script>
