<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexreaper Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Base styles */
    body, #root { margin:0; padding:0; min-height:100vh; background:#0E1226; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:#1F2850; }
    ::-webkit-scrollbar-thumb { background:#E8A33D; border-radius:4px; }
    /* Custom card / button styles (Tailwind classes cover most) */
    .bg-surface { background: #171E3E; }
    .bg-surface2 { background: #1F2850; }
    .border-line { border-color: #2C3564; }
    .text-gold { color: #E8A33D; }
    .text-sub { color: #8D93B8; }
    .text-hi { color: #F3EEE2; }
    .btn-gold { background: #E8A33D; color: #1A1000; }
    .btn-gold:hover { background: #FFC876; }
    .input-dark { background: #1F2850; border: 1px solid #2C3564; color: #F3EEE2; border-radius: 10px; padding: 10px 12px; outline: none; width: 100%; }
    .input-dark:focus { border-color: #E8A33D; }
    /* Progress arc (SVG) */
    .arc-container { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem 0; }
    .arc-text { position: absolute; top: 44px; display: flex; flex-direction: column; align-items: center; }
    .arc-text .percent { font-size: 2.25rem; font-weight: 700; font-family: 'Fraunces', serif; color: #F3EEE2; }
    .arc-text .label { font-size: 0.6875rem; letter-spacing: 0.05em; color: #8D93B8; }
    /* Milestone bar */
    .milestone-track { height: 4px; border-radius: 4px; background: #1F2850; margin-top: 0.75rem; }
    .milestone-fill { height: 100%; border-radius: 4px; background: #4FB08A; transition: width 0.3s; }
    /* Tabs */
    .tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.375rem; padding: 0.5rem 0.75rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 500; transition: background 0.2s; }
    .tab-btn.active { background: #1F2850; color: #E8A33D; }
    .tab-btn.inactive { color: #8D93B8; }
    /* Check item */
    .check-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; width: 100%; text-align: left; background: none; border: none; cursor: pointer; }
    .check-item .check-icon { flex-shrink: 0; }
    .check-item .check-label { flex: 1; font-size: 0.9375rem; font-weight: 500; color: #F3EEE2; transition: opacity 0.2s; }
    .check-item .check-label.done { text-decoration: line-through; opacity: 0.6; }
    .check-item .check-sub { font-size: 0.75rem; color: #8D93B8; }
    /* Water glasses */
    .water-grid { display: flex; gap: 0.375rem; margin-top: 0.5rem; }
    .water-glass { flex: 1; height: 1.75rem; border-radius: 6px; border: 1px solid #2C3564; background: #1F2850; cursor: pointer; transition: background 0.2s; }
    .water-glass.filled { background: #E8A33D; }
    /* Prayer grid */
    .prayer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
    .prayer-btn { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.5rem; border-radius: 0.75rem; border: 1px solid #2C3564; background: transparent; transition: background 0.2s; cursor: pointer; }
    .prayer-btn.done { background: #1F2850; border-color: #E8A33D; }
    .prayer-btn .prayer-label { font-size: 0.6875rem; color: #F3EEE2; }
    /* Roadmap stage */
    .roadmap-stage { margin-top: 1rem; }
    .roadmap-stage .stage-title { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.875rem; color: #F3EEE2; }
    .roadmap-stage .stage-items { padding-left: 1.25rem; border-left: 1px solid #2C3564; }
    /* Chart bars */
    .chart-container { width: 100%; height: 140px; display: flex; align-items: flex-end; gap: 0.5rem; padding-top: 0.5rem; }
    .chart-bar { flex: 1; background: #E8A33D; border-radius: 6px 6px 0 0; min-height: 4px; transition: height 0.3s; position: relative; }
    .chart-bar .bar-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 0.625rem; color: #8D93B8; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
    .modal-box { background: #171E3E; border: 1px solid #2C3564; border-radius: 1rem 1rem 0 0; padding: 1.25rem; max-height: 85vh; overflow-y: auto; width: 100%; max-width: 448px; }
    @media (min-width: 640px) { .modal-box { border-radius: 1rem; margin-bottom: auto; } .modal-overlay { align-items: center; } }
    /* Responsive fixes */
    .max-w-ledger { max-width: 48rem; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    /* ---------- HELPERS ---------- */
    const uid = () => Math.random().toString(36).slice(2, 9);
    const todayKey = (d = new Date()) => d.toISOString().slice(0, 10);
    const dayLabel = (key) => new Date(key + "T00:00:00").toLocaleDateString(undefined, { weekday: "short" });
    const monthKey = (d = new Date()) => d.toISOString().slice(0, 7);
    const monthLabel = (k) => new Date(k + "-01T00:00:00").toLocaleDateString(undefined, { month: "short", year: "numeric" });
    const fmtDate = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    const fmtMoney = (n, cur = "USD") => {
      try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(n || 0); }
      catch { return `${cur} ${Math.round(n || 0)}`; }
    };
    const greeting = () => {
      const h = new Date().getHours();
      if (h < 12) return "Good morning";
      if (h < 17) return "Good afternoon";
      if (h < 21) return "Good evening";
      return "Good night";
    };

    const C = {
      night: "#0E1226", surface: "#171E3E", surface2: "#1F2850",
      line: "#2C3564", text: "#F3EEE2", sub: "#8D93B8",
      gold: "#E8A33D", goldHi: "#FFC876", green: "#4FB08A", red: "#E0654B",
    };

    const QUOTES = [
      "Discipline is choosing between what you want now and what you want most.",
      "You do not rise to the level of your goals, you fall to the level of your systems.",
      "The pain of discipline weighs ounces; the pain of regret weighs tons.",
      "Small daily improvements are the key to staggering long-term results.",
      "A single sunrise doesn't change your life — showing up every sunrise does.",
      "Consistency turns intention into identity.",
      "What you repeat, you become.",
      "Every rep, every prayer, every page — a vote for who you're becoming.",
    ];

    const RELIGIONS = [
      { id: "islam", label: "Islam", practice: "prayers", practiceLabel: "5 Daily Prayers" },
      { id: "christianity", label: "Christianity", practice: "scripture", practiceLabel: "Prayer & Scripture Reading" },
      { id: "hinduism", label: "Hinduism", practice: "puja", practiceLabel: "Meditation / Puja" },
      { id: "buddhism", label: "Buddhism", practice: "meditation", practiceLabel: "Meditation" },
      { id: "other", label: "Other / Prefer not to say", practice: null, practiceLabel: null },
    ];

    const PRAYERS = [
      { id: "fajr", label: "Fajr" },
      { id: "dhuhr", label: "Dhuhr" },
      { id: "asr", label: "Asr" },
      { id: "maghrib", label: "Maghrib" },
      { id: "isha", label: "Isha" },
    ];

    const CAREERS = {
      "Cybersecurity Expert": [
        { title: "Foundations", items: ["Learn networking basics (TCP/IP, DNS, OSI model)", "Get comfortable in Linux & command line", "Learn Python or Bash scripting"] },
        { title: "Core Security Concepts", items: ["Study the CIA triad & core security principles", "Learn OWASP Top 10", "Understand cryptography fundamentals"] },
        { title: "Hands-On Practice", items: ["Build a home lab (VirtualBox/VMware)", "Practice on TryHackMe and HackTheBox", "Learn a SIEM basics (Splunk or ELK)"] },
        { title: "Certifications", items: ["CompTIA Security+", "eJPT or CEH", "OSCP (for offensive security track)"] },
        { title: "Specialize", items: ["Pick a track: Pentesting, SOC Analyst, Cloud Security, or GRC", "Build a portfolio of write-ups & CTF results"] },
        { title: "Get Experience", items: ["Apply for SOC analyst / security internships", "Try bug bounty programs", "Network in the infosec community"] },
      ],
      "Software Developer": [
        { title: "Foundations", items: ["Learn a core language (Python, JS, or Java)", "Data structures & algorithms", "Git & version control"] },
        { title: "Build", items: ["Build 3–5 real projects", "Learn a web framework (React/Node)", "Learn SQL & databases"] },
        { title: "Level Up", items: ["Contribute to open source", "Learn system design basics", "Practice technical interviews"] },
        { title: "Get In", items: ["Build a portfolio site + GitHub", "Apply widely, do mock interviews", "Land an internship or junior role"] },
      ],
      "Data Scientist / AI Engineer": [
        { title: "Foundations", items: ["Python, statistics & linear algebra", "Pandas, NumPy, data wrangling", "SQL for data querying"] },
        { title: "Core Skills", items: ["Machine learning fundamentals (scikit-learn)", "Data visualization (matplotlib/Seaborn)", "Intro to deep learning (PyTorch/TensorFlow)"] },
        { title: "Portfolio", items: ["3+ end-to-end ML projects on GitHub", "Kaggle competitions", "Learn to communicate insights clearly"] },
        { title: "Break In", items: ["Apply for data/ML internships", "Contribute to open datasets or research", "Keep up with new papers & tools"] },
      ],
      "Doctor": [
        { title: "Pre-Med", items: ["Excel in biology, chemistry, physics", "Take the MCAT / equivalent entrance exam", "Get clinical volunteering experience"] },
        { title: "Medical School", items: ["Complete pre-clinical coursework", "Pass licensing exam steps", "Clinical rotations across specialties"] },
        { title: "Residency", items: ["Choose a specialty", "Match into residency", "Build hands-on patient experience"] },
        { title: "Practice", items: ["Board certification", "Continuing education", "Build your practice or hospital career"] },
      ],
      "Entrepreneur / Business Owner": [
        { title: "Foundations", items: ["Study business fundamentals & your industry", "Learn basic finance & accounting", "Talk to 20 potential customers"] },
        { title: "Validate", items: ["Build a minimum viable product/service", "Get your first 10 paying customers", "Iterate based on feedback"] },
        { title: "Grow", items: ["Set up systems & basic ops", "Build a small team or network of contractors", "Reinvest profit into growth"] },
        { title: "Scale", items: ["Diversify revenue streams", "Build a brand people trust", "Mentor others / give back"] },
      ],
      "Fitness Coach": [
        { title: "Foundations", items: ["Learn anatomy & exercise science basics", "Train consistently yourself", "Learn program design fundamentals"] },
        { title: "Certify", items: ["Get a recognized certification (NASM/ACE/ISSA)", "Learn nutrition basics", "Practice coaching friends/family for free"] },
        { title: "Build Experience", items: ["Take on paid clients", "Build an online presence (content, results)", "Specialize (strength, weight loss, sport-specific)"] },
        { title: "Grow", items: ["Build a client roster or gym business", "Keep learning — courses, certifications", "Build referral & retention systems"] },
      ],
      "Teacher / Educator": [
        { title: "Foundations", items: ["Complete relevant degree / teaching program", "Get classroom experience (student teaching/TA)", "Learn classroom management basics"] },
        { title: "Certify", items: ["Get teaching certification/license", "Choose a subject/grade specialty"] },
        { title: "Grow", items: ["Build your own lesson library", "Learn to differentiate instruction", "Seek mentorship from senior teachers"] },
        { title: "Lead", items: ["Take on leadership roles (dept head, mentor)", "Keep growing — workshops, further study"] },
      ],
    };

    const genericRoadmap = (goal) => [
      { title: "Learn the Fundamentals", items: [`Study the core knowledge needed for ${goal}`, "Follow a structured course or curriculum", "Read 1–2 foundational books in the field"] },
      { title: "Build Real Experience", items: ["Work on small real projects or practice cases", "Seek feedback from people ahead of you", "Track and reflect on what you learn weekly"] },
      { title: "Get Credentialed", items: ["Earn a relevant certification or credential", "Build a portfolio or track record of results"] },
      { title: "Network & Apply", items: ["Connect with people already doing this work", "Apply for opportunities / put yourself out there"] },
      { title: "Specialize & Grow", items: ["Pick a niche within the field", "Keep learning — become known for depth"] },
    ];

    const GOAL_DEFS = [
      { id: "habit", label: "Break a Habit", icon: "🔥", desc: "Track a streak for a habit you want to quit (e.g. masturbation, smoking, junk food)." },
      { id: "exercise", label: "Exercise Daily", icon: "💪", desc: "Track daily reps or workouts, like 10 pushups a day." },
      { id: "reading", label: "Read Daily", icon: "📖", desc: "Build a daily reading habit." },
      { id: "writing", label: "Write Daily", icon: "✍️", desc: "Journal or write something every day." },
      { id: "water", label: "Drink Water", icon: "💧", desc: "Track daily water intake." },
      { id: "sleep", label: "Sleep Early", icon: "🌙", desc: "Track a consistent early bedtime." },
      { id: "savings", label: "Save Money for Something", icon: "🐷", desc: "Budget monthly income vs expenses and track progress toward a purchase — gaming PC, car, etc." },
    ];

    const LOOKS_TASKS = [
      { id: "cleanse_am", label: "Cleanse face (AM)" },
      { id: "moisturize", label: "Moisturize" },
      { id: "spf", label: "Apply SPF / sun protection" },
      { id: "cleanse_pm", label: "Cleanse face (PM)" },
      { id: "posture", label: "Posture check — stand/sit tall" },
      { id: "mewing", label: "Tongue posture (mewing) & jaw relax" },
      { id: "hair", label: "Haircare (brush/style/condition)" },
      { id: "grooming", label: "Grooming — nails, brows, beard/skin" },
      { id: "stretch", label: "Stretch / mobility work" },
      { id: "confidence", label: "Dress well & confidence check" },
    ];
    const LOOKS_TIPS = [
      "Skin: cleanse twice daily, moisturize, and never skip SPF — consistency beats any product.",
      "Hair: regular trims and a routine matched to your hair type go further than trends.",
      "Posture: standing tall instantly changes how you're perceived — and how you feel.",
      "Fitness & sleep affect your face and body more than any single trick — train and rest well.",
      "Grooming basics (nails, brows, skin) are quiet signals of self-respect people notice.",
      "Confidence is a habit — good hygiene, good posture, and showing up prepared build it daily.",
    ];

    /* ---------- STATE (stored in localStorage) ---------- */
    function loadState(key, fallback) {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
    }
    function saveState(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
    }

    let profile = loadState('profile', null);
    let logs = loadState('logs', {});

    function updateProfile(p) { profile = p; saveState('profile', p); render(); }
    function updateLogs(l) { logs = l; saveState('logs', l); render(); }

    /* ---------- RENDER ENGINE ---------- */
    function render() {
      const root = document.getElementById('root');
      if (!profile) {
        root.innerHTML = renderOnboarding();
        attachOnboardingEvents();
      } else {
        root.innerHTML = renderDashboard(profile, logs);
        attachDashboardEvents(profile, logs);
      }
    }

    /* ---------- ONBOARDING ---------- */
    let onbStep = 0;
    const onbState = {
      name: '', age: '', weight: '', weightUnit: 'kg', religion: null, goals: [],
      habitName: '', pushupTarget: 10, career: '', customCareer: '',
      savingsGoalName: '', savingsTarget: '', savingsCurrent: '0',
      monthlyIncome: '', monthlyExpenses: '', currency: 'USD'
    };

    function renderOnboarding() {
      const s = onbState;
      const steps = ['Welcome', 'About You', 'Beliefs', 'Your Goals', 'Future Self'];
      let content = '';
      if (onbStep === 0) {
        content = `
          <div class="flex flex-col items-center text-center gap-4 py-8">
            <div class="text-5xl">🌅</div>
            <h1 class="text-3xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">Daily Discipline</h1>
            <p style="color:#8D93B8;" class="max-w-sm">A quiet ledger for the person you're becoming — prayer, body, mind, and the road toward who you want to be. Let's set it up.</p>
          </div>
        `;
      } else if (onbStep === 1) {
        content = `
          <div class="flex flex-col gap-4">
            <h2 class="text-xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">Tell me about you</h2>
            <div class="flex flex-col gap-2">
              <label class="text-xs font-medium" style="color:#8D93B8;">Your name</label>
              <input id="onb-name" class="input-dark" placeholder="e.g. Ahmed" value="${s.name}" />
            </div>
            <div class="flex gap-3">
              <div class="flex-1">
                <label class="text-xs font-medium" style="color:#8D93B8;">Age</label>
                <input id="onb-age" type="number" min="10" max="100" class="input-dark" placeholder="22" value="${s.age}" />
              </div>
              <div class="flex-1">
                <label class="text-xs font-medium" style="color:#8D93B8;">Weight</label>
                <div class="flex gap-2">
                  <input id="onb-weight" type="number" min="1" class="input-dark" placeholder="70" value="${s.weight}" style="flex:1;" />
                  <select id="onb-weight-unit" class="input-dark" style="width:76px;">
                    <option value="kg" ${s.weightUnit==='kg'?'selected':''}>kg</option>
                    <option value="lb" ${s.weightUnit==='lb'?'selected':''}>lb</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (onbStep === 2) {
        content = `
          <div class="flex flex-col gap-4">
            <h2 class="text-xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">What's your faith background?</h2>
            <p class="text-sm" style="color:#8D93B8;">This helps us tailor a daily spiritual practice. Totally optional.</p>
            <div class="flex flex-col gap-2">
              ${RELIGIONS.map(r => `
                <button class="onb-religion text-left px-4 py-3 rounded-xl flex items-center justify-between" data-id="${r.id}" style="background:${s.religion===r.id?'#1F2850':'transparent'}; border:1px solid ${s.religion===r.id?'#E8A33D':'#2C3564'};">
                  <span style="color:#F3EEE2;" class="font-medium">${r.label}</span>
                  ${s.religion===r.id ? '<span style="color:#E8A33D;">✓</span>' : ''}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } else if (onbStep === 3) {
        const goalButtons = GOAL_DEFS.map(g => `
          <button class="onb-goal text-left px-4 py-3 rounded-xl flex items-start gap-3" data-id="${g.id}" style="background:${s.goals.includes(g.id)?'#1F2850':'transparent'}; border:1px solid ${s.goals.includes(g.id)?'#E8A33D':'#2C3564'};">
            <span class="text-lg">${g.icon}</span>
            <div class="flex-1">
              <div style="color:#F3EEE2;" class="font-medium text-sm">${g.label}</div>
              <div style="color:#8D93B8;" class="text-xs">${g.desc}</div>
            </div>
            ${s.goals.includes(g.id) ? '<span style="color:#E8A33D;">✓</span>' : ''}
          </button>
        `).join('');
        let extras = '';
        if (s.goals.includes('habit')) {
          extras += `<input id="onb-habit-name" class="input-dark mt-2" placeholder="What habit? e.g. Masturbation, smoking, junk food" value="${s.habitName}" />`;
        }
        if (s.goals.includes('exercise')) {
          extras += `<div class="flex items-center gap-2 mt-2"><span class="text-sm" style="color:#8D93B8;">Daily pushup target:</span><input id="onb-pushups" type="number" min="1" class="input-dark" style="width:80px;" value="${s.pushupTarget}" /></div>`;
        }
        if (s.goals.includes('savings')) {
          extras += `
            <div class="flex flex-col gap-2 p-3 rounded-xl" style="background:#1F2850; border:1px solid #2C3564; margin-top:8px;">
              <span class="text-xs font-medium" style="color:#8D93B8;">What are you saving for?</span>
              <input id="onb-savings-name" class="input-dark" placeholder="e.g. Gaming PC, Car, Trip" value="${s.savingsGoalName}" />
              <div class="flex gap-2">
                <div class="flex-1"><label class="text-xs" style="color:#8D93B8;">Target cost</label><input id="onb-savings-target" type="number" min="0" class="input-dark" placeholder="1500" value="${s.savingsTarget}" /></div>
                <div class="flex-1"><label class="text-xs" style="color:#8D93B8;">Already saved</label><input id="onb-savings-current" type="number" min="0" class="input-dark" placeholder="0" value="${s.savingsCurrent}" /></div>
              </div>
              <div class="flex gap-2">
                <div class="flex-1"><label class="text-xs" style="color:#8D93B8;">Monthly income</label><input id="onb-income" type="number" min="0" class="input-dark" placeholder="1200" value="${s.monthlyIncome}" /></div>
                <div class="flex-1"><label class="text-xs" style="color:#8D93B8;">Monthly expenses</label><input id="onb-expenses" type="number" min="0" class="input-dark" placeholder="900" value="${s.monthlyExpenses}" /></div>
              </div>
              <div class="flex-1">
                <label class="text-xs" style="color:#8D93B8;">Currency</label>
                <select id="onb-currency" class="input-dark">
                  <option value="USD" ${s.currency==='USD'?'selected':''}>USD ($)</option>
                  <option value="EUR" ${s.currency==='EUR'?'selected':''}>EUR (€)</option>
                  <option value="GBP" ${s.currency==='GBP'?'selected':''}>GBP (£)</option>
                  <option value="PKR" ${s.currency==='PKR'?'selected':''}>PKR (₨)</option>
                  <option value="INR" ${s.currency==='INR'?'selected':''}>INR (₹)</option>
                  <option value="AED" ${s.currency==='AED'?'selected':''}>AED (د.إ)</option>
                  <option value="SAR" ${s.currency==='SAR'?'selected':''}>SAR (﷼)</option>
                </select>
              </div>
            </div>
          `;
        }
        content = `
          <div class="flex flex-col gap-3">
            <h2 class="text-xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">What do you want to build or break?</h2>
            <p class="text-sm" style="color:#8D93B8;">Pick everything you want to track daily.</p>
            <div class="flex flex-col gap-2 max-h-64 overflow-y-auto pr-1">${goalButtons}</div>
            ${extras}
          </div>
        `;
      } else if (onbStep === 4) {
        const careerOptions = Object.keys(CAREERS).concat(['Other']).map(c => `
          <button class="onb-career text-left px-3 py-2.5 rounded-xl text-sm font-medium" data-id="${c}" style="background:${s.career===c?'#1F2850':'transparent'}; border:1px solid ${s.career===c?'#E8A33D':'#2C3564'}; color:#F3EEE2;">${c}</button>
        `).join('');
        content = `
          <div class="flex flex-col gap-3">
            <h2 class="text-xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">Who do you want to become?</h2>
            <p class="text-sm" style="color:#8D93B8;">Pick a path and I'll build you a roadmap.</p>
            <div class="grid grid-cols-2 gap-2 max-h-56 overflow-y-auto pr-1">${careerOptions}</div>
            ${s.career === 'Other' ? `<input id="onb-custom-career" class="input-dark mt-2" placeholder="Type your goal, e.g. Airline Pilot" value="${s.customCareer}" />` : ''}
          </div>
        `;
      }

      const isLast = onbStep === 4;
      const canNext = () => {
        if (onbStep === 1) return onbState.name.trim() && onbState.age && onbState.weight;
        if (onbStep === 2) return onbState.religion !== null;
        if (onbStep === 3) {
          if (onbState.goals.length === 0) return false;
          if (onbState.goals.includes('habit') && !onbState.habitName.trim()) return false;
          if (onbState.goals.includes('savings') && (!onbState.savingsGoalName.trim() || !onbState.savingsTarget)) return false;
          return true;
        }
        if (onbStep === 4) {
          if (onbState.career === 'Other' && !onbState.customCareer.trim()) return false;
          if (onbState.career === '') return false;
          return true;
        }
        return true;
      };

      return `
        <div class="min-h-screen flex items-center justify-center px-4" style="background:#0E1226;">
          <div class="w-full max-w-lg">
            <div class="flex items-center justify-center gap-1.5 mb-8">
              ${steps.map((_, i) => `<div class="h-1.5 rounded-full transition-all" style="width:${i===onbStep?'28px':'8px'}; background:${i<=onbStep?'#E8A33D':'#2C3564'};"></div>`).join('')}
            </div>
            <div class="rounded-2xl p-5 min-h-[420px] flex flex-col" style="background:#171E3E; border:1px solid #2C3564;">
              <div class="flex-1">${content}</div>
              <div class="flex items-center justify-between mt-6 pt-4" style="border-top:1px solid #2C3564;">
                ${onbStep > 0 ? `<button class="onb-back flex items-center gap-2 px-5 py-3 rounded-xl font-medium" style="background:transparent; color:#8D93B8; border:1px solid #2C3564;"><span>◀</span>Back</button>` : '<div></div>'}
                ${!isLast ? `<button class="onb-next flex items-center gap-2 px-6 py-3 rounded-xl font-semibold ${canNext()?'btn-gold':'opacity-40'}" ${canNext()?'':'disabled'}>Continue<span>▶</span></button>` :
                  `<button class="onb-finish flex items-center gap-2 px-6 py-3 rounded-xl font-semibold btn-gold ${canNext()?'':'opacity-40'}" ${canNext()?'':'disabled'}><span>✨</span>Start My Ledger</button>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function attachOnboardingEvents() {
      // Collect input values
      const nameInput = document.getElementById('onb-name');
      if (nameInput) nameInput.addEventListener('input', e => { onbState.name = e.target.value; });
      const ageInput = document.getElementById('onb-age');
      if (ageInput) ageInput.addEventListener('input', e => { onbState.age = e.target.value; });
      const weightInput = document.getElementById('onb-weight');
      if (weightInput) weightInput.addEventListener('input', e => { onbState.weight = e.target.value; });
      const weightUnitSelect = document.getElementById('onb-weight-unit');
      if (weightUnitSelect) weightUnitSelect.addEventListener('change', e => { onbState.weightUnit = e.target.value; });

      // Religion buttons
      document.querySelectorAll('.onb-religion').forEach(btn => {
        btn.addEventListener('click', function() {
          onbState.religion = this.dataset.id;
          render();
        });
      });

      // Goal toggles
      document.querySelectorAll('.onb-goal').forEach(btn => {
        btn.addEventListener('click', function() {
          const id = this.dataset.id;
          const idx = onbState.goals.indexOf(id);
          if (idx > -1) onbState.goals.splice(idx, 1);
          else onbState.goals.push(id);
          render();
        });
      });

      // Habit name, pushups, savings inputs
      const habitInput = document.getElementById('onb-habit-name');
      if (habitInput) habitInput.addEventListener('input', e => { onbState.habitName = e.target.value; });
      const pushupInput = document.getElementById('onb-pushups');
      if (pushupInput) pushupInput.addEventListener('input', e => { onbState.pushupTarget = Number(e.target.value) || 10; });
      const savingsName = document.getElementById('onb-savings-name');
      if (savingsName) savingsName.addEventListener('input', e => { onbState.savingsGoalName = e.target.value; });
      const savingsTarget = document.getElementById('onb-savings-target');
      if (savingsTarget) savingsTarget.addEventListener('input', e => { onbState.savingsTarget = e.target.value; });
      const savingsCurrent = document.getElementById('onb-savings-current');
      if (savingsCurrent) savingsCurrent.addEventListener('input', e => { onbState.savingsCurrent = e.target.value; });
      const income = document.getElementById('onb-income');
      if (income) income.addEventListener('input', e => { onbState.monthlyIncome = e.target.value; });
      const expenses = document.getElementById('onb-expenses');
      if (expenses) expenses.addEventListener('input', e => { onbState.monthlyExpenses = e.target.value; });
      const currencySelect = document.getElementById('onb-currency');
      if (currencySelect) currencySelect.addEventListener('change', e => { onbState.currency = e.target.value; });

      // Career buttons
      document.querySelectorAll('.onb-career').forEach(btn => {
        btn.addEventListener('click', function() {
          onbState.career = this.dataset.id;
          render();
        });
      });
      const customCareerInput = document.getElementById('onb-custom-career');
      if (customCareerInput) customCareerInput.addEventListener('input', e => { onbState.customCareer = e.target.value; });

      // Navigation
      const backBtn = document.querySelector('.onb-back');
      if (backBtn) backBtn.addEventListener('click', () => { onbStep--; render(); });
      const nextBtn = document.querySelector('.onb-next');
      if (nextBtn) nextBtn.addEventListener('click', () => { onbStep++; render(); });
      const finishBtn = document.querySelector('.onb-finish');
      if (finishBtn) finishBtn.addEventListener('click', () => {
        const religionObj = RELIGIONS.find(r => r.id === onbState.religion);
        const finalCareer = onbState.career === 'Other' ? onbState.customCareer.trim() : onbState.career;
        const finalGoals = [...onbState.goals];
        if (religionObj?.practice && !finalGoals.includes('spiritual')) finalGoals.push('spiritual');
        profile = {
          id: uid(),
          name: onbState.name.trim(),
          age: Number(onbState.age),
          weight: Number(onbState.weight),
          weightUnit: onbState.weightUnit,
          religion: onbState.religion,
          religionPractice: religionObj?.practice || null,
          religionPracticeLabel: religionObj?.practiceLabel || null,
          goals: finalGoals,
          habitName: onbState.habitName.trim() || 'Bad Habit',
          pushupTarget: Number(onbState.pushupTarget) || 10,
          careerGoal: finalCareer,
          lastRelapseDate: todayKey(),
          habitStartDate: todayKey(),
          roadmapProgress: {},
          createdAt: todayKey(),
          savingsGoalName: onbState.savingsGoalName.trim(),
          savingsTarget: Number(onbState.savingsTarget) || 0,
          savingsCurrent: Number(onbState.savingsCurrent) || 0,
          monthlyIncome: Number(onbState.monthlyIncome) || 0,
          monthlyExpenses: Number(onbState.monthlyExpenses) || 0,
          currency: onbState.currency,
          savingsLog: {},
          sleepStatus: 'awake',
          sleepStartedAt: null,
          sleepSessions: [],
          sleepTargetHours: 8,
        };
        logs = {};
        saveState('profile', profile);
        saveState('logs', logs);
        render();
      });
    }

    /* ---------- DASHBOARD ---------- */
    function renderDashboard(profile, logs) {
      const today = todayKey();
      const log = logs[today] || {};
      const curMonth = monthKey();
      const monthlySavings = (profile.monthlyIncome || 0) - (profile.monthlyExpenses || 0);
      const savingsCurrent = profile.savingsCurrent || 0;
      const savingsTarget = profile.savingsTarget || 0;
      const remaining = Math.max(0, savingsTarget - savingsCurrent);
      const monthsRemaining = monthlySavings > 0 ? Math.ceil(remaining / monthlySavings) : null;
      const projectedDate = monthsRemaining != null ? new Date(new Date().setMonth(new Date().getMonth() + monthsRemaining)).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : null;
      const loggedThisMonth = !!profile.savingsLog?.[curMonth];

      const habitStreak = (() => {
        const start = new Date((profile.lastRelapseDate || profile.habitStartDate) + 'T00:00:00');
        const now = new Date(todayKey() + 'T00:00:00');
        return Math.max(0, Math.round((now - start) / 86400000));
      })();

      // Tasks for progress
      const tasks = [];
      if (profile.goals.includes('habit')) tasks.push({ id: 'habit_ok', done: true });
      if (profile.goals.includes('spiritual')) {
        if (profile.religionPractice === 'prayers') {
          const done = PRAYERS.every(p => log.prayers?.[p.id]);
          tasks.push({ id: 'prayers', done });
        } else {
          tasks.push({ id: 'spiritual', done: !!log.spiritual });
        }
      }
      if (profile.goals.includes('exercise')) tasks.push({ id: 'exercise', done: !!log.exerciseDone });
      if (profile.goals.includes('reading')) tasks.push({ id: 'reading', done: !!log.reading });
      if (profile.goals.includes('writing')) tasks.push({ id: 'writing', done: !!log.writing });
      if (profile.goals.includes('water')) tasks.push({ id: 'water', done: (log.water || 0) >= 8 });
      if (profile.goals.includes('sleep')) tasks.push({ id: 'sleep', done: !!log.sleep });

      const trackedCount = tasks.filter(t => t.id !== 'habit_ok').length || 1;
      const doneCount = tasks.filter(t => t.id !== 'habit_ok' && t.done).length;
      const pct = doneCount / trackedCount;

      // Weekly chart data (last 7 days)
      const weekData = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = todayKey(d);
        const l = logs[key] || {};
        let total = 0, done = 0;
        if (profile.goals.includes('spiritual')) {
          total++;
          if (profile.religionPractice === 'prayers') { if (PRAYERS.every(p => l.prayers?.[p.id])) done++; }
          else if (l.spiritual) done++;
        }
        if (profile.goals.includes('exercise')) { total++; if (l.exerciseDone) done++; }
        if (profile.goals.includes('reading')) { total++; if (l.reading) done++; }
        if (profile.goals.includes('writing')) { total++; if (l.writing) done++; }
        if (profile.goals.includes('water')) { total++; if ((l.water || 0) >= 8) done++; }
        if (profile.goals.includes('sleep')) { total++; if (l.sleep) done++; }
        const pctDay = total ? Math.round((done / total) * 100) : 0;
        weekData.push({ day: dayLabel(key), pct: pctDay });
      }

      const quote = QUOTES[new Date().getDate() % QUOTES.length];
      const roadmap = CAREERS[profile.careerGoal] || genericRoadmap(profile.careerGoal);
      const roadmapTotal = roadmap.reduce((s, st) => s + st.items.length, 0);
      const roadmapDone = Object.values(profile.roadmapProgress || {}).filter(Boolean).length;

      // Build HTML
      let html = `
        <div class="min-h-screen pb-10" style="background:#0E1226;">
          <div class="px-5 pt-6 pb-2 flex items-center justify-between max-w-ledger mx-auto">
            <div>
              <div class="text-xs tracking-widest" style="color:#8D93B8;">${fmtDate(new Date()).toUpperCase()}</div>
              <h1 class="text-2xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">${greeting()}, ${profile.name}</h1>
            </div>
            <button id="settings-toggle" class="p-2 rounded-full" style="border:1px solid #2C3564;">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8D93B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>

          <!-- Tabs -->
          <div class="max-w-ledger mx-auto px-5 mt-3">
            <div class="flex gap-1 p-1.5 rounded-2xl" style="background:#171E3E; border:1px solid #2C3564;">
              <button class="tab-btn active" data-tab="home">🌅 Home</button>
              <button class="tab-btn inactive" data-tab="sleep">🌙 Sleep</button>
              <button class="tab-btn inactive" data-tab="looks">✨ Looksmaxing</button>
            </div>
          </div>

          <div id="tab-content" class="max-w-ledger mx-auto px-5 flex flex-col gap-5 mt-4">
      `;

      // Home tab (default)
      html += `
        <div id="home-tab" class="flex flex-col gap-5">
          <!-- Sunrise Arc -->
          <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
            <div class="arc-container">
              <svg width="180" height="110" viewBox="0 0 180 110">
                <path d="M 20 100 A 70 70 0 0 1 160 100" fill="none" stroke="#2C3564" stroke-width="10" stroke-linecap="round" />
                <path d="M 20 100 A 70 70 0 0 1 160 100" fill="none" stroke="#E8A33D" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*70)*Math.min(1,pct)} ${2*Math.PI*70}" style="transition: stroke-dasharray 0.6s ease;" />
                <circle cx="${20 + 140 * Math.min(1,pct)}" cy="${100 - Math.sin(Math.PI * Math.min(1,pct)) * 70}" r="7" fill="#FFC876" opacity="${pct>0?1:0}" />
              </svg>
              <div class="arc-text">
                <div class="percent">${Math.round(pct*100)}%</div>
                <div class="label">TODAY'S PROGRESS</div>
              </div>
            </div>
            <div class="flex items-center gap-2 justify-center text-center mt-1">
              <span>✨</span>
              <p class="text-xs italic" style="color:#8D93B8;">${quote}</p>
            </div>
          </div>

          <!-- Habit streak -->
          ${profile.goals.includes('habit') ? `
            <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="p-2.5 rounded-xl" style="background:#1F2850;"><span class="text-xl">🔥</span></div>
                  <div>
                    <div class="text-xs" style="color:#8D93B8;">STREAK — ${profile.habitName}</div>
                    <div class="text-2xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">${habitStreak} ${habitStreak===1?'day':'days'}</div>
                  </div>
                </div>
                <button id="habit-reset" class="flex items-center gap-2 px-4 py-2 rounded-xl" style="background:transparent; color:#8D93B8; border:1px solid #2C3564; font-size:0.875rem;"><span>↺</span>Reset</button>
              </div>
              <div class="mt-4">
                <div class="flex justify-between text-[11px] mb-1" style="color:#8D93B8;">
                  <span>${[3,7,14,30,60,90].reverse().find(m=>m<=habitStreak)||0}d</span>
                  <span>Next: ${[3,7,14,30,60,90].find(m=>m>habitStreak)||'90'}d</span>
                </div>
                <div class="h-1.5 rounded-full" style="background:#1F2850;">
                  <div class="h-1.5 rounded-full" style="width:${Math.min(100, ((habitStreak - ([3,7,14,30,60,90].reverse().find(m=>m<=habitStreak)||0)) / (([3,7,14,30,60,90].find(m=>m>habitStreak)||90) - ([3,7,14,30,60,90].reverse().find(m=>m<=habitStreak)||0) || 1)) * 100)}%; background:#4FB08A;"></div>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- Spiritual -->
          ${profile.goals.includes('spiritual') ? `
            <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
              <div class="flex items-center gap-2"><span>🌅</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">${profile.religionPracticeLabel}</h3></div>
              ${profile.religionPractice === 'prayers' ? `
                <div class="prayer-grid">
                  ${PRAYERS.map(p => `
                    <button class="prayer-btn ${log.prayers?.[p.id]?'done':''}" data-prayer="${p.id}" style="border-color:${log.prayers?.[p.id]?'#E8A33D':'#2C3564'}; background:${log.prayers?.[p.id]?'#1F2850':'transparent'};">
                      ${log.prayers?.[p.id] ? '<span style="color:#4FB08A;">✓</span>' : '<span style="color:#2C3564;">○</span>'}
                      <span class="prayer-label" style="color:#F3EEE2;">${p.label}</span>
                    </button>
                  `).join('')}
                </div>
              ` : `
                <button class="check-item" id="spiritual-toggle">
                  <span class="check-icon">${log.spiritual ? '<span style="color:#4FB08A;">✓</span>' : '<span style="color:#2C3564;">○</span>'}</span>
                  <span class="check-label ${log.spiritual?'done':''}">${profile.religionPracticeLabel}</span>
                </button>
              `}
            </div>
          ` : ''}

          <!-- Exercise -->
          ${profile.goals.includes('exercise') ? `
            <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
              <div class="flex items-center gap-2"><span>💪</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">Exercise</h3></div>
              <div class="flex items-center justify-between mt-1">
                <div>
                  <div class="text-2xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">${log.exerciseCount||0} <span class="text-sm font-normal" style="color:#8D93B8;">/ ${profile.pushupTarget} pushups</span></div>
                </div>
                <div class="flex gap-2">
                  <button class="exercise-dec px-3 py-2 rounded-xl" style="background:transparent; color:#8D93B8; border:1px solid #2C3564;">-5</button>
                  <button class="exercise-inc px-3 py-2 rounded-xl btn-gold">+5</button>
                </div>
              </div>
              <div class="h-2 rounded-full mt-3" style="background:#1F2850;">
                <div class="h-2 rounded-full transition-all" style="width:${Math.min(100, ((log.exerciseCount||0)/profile.pushupTarget)*100)}%; background:#E8A33D;"></div>
              </div>
            </div>
          ` : ''}

          <!-- Daily Practice (reading, writing, water, sleep) -->
          ${(profile.goals.includes('reading')||profile.goals.includes('writing')||profile.goals.includes('water')||profile.goals.includes('sleep')) ? `
            <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
              <div class="flex items-center gap-2"><span>🎯</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">Daily Practice</h3></div>
              <div class="flex flex-col divide-y" style="border-color:#2C3564;">
                ${profile.goals.includes('reading') ? `
                  <button class="check-item" data-check="reading">
                    <span class="check-icon">${log.reading ? '<span style="color:#4FB08A;">✓</span>' : '<span style="color:#2C3564;">○</span>'}</span>
                    <span class="check-label ${log.reading?'done':''}">Read today</span>
                    <span class="check-sub">Even 10 pages counts</span>
                  </button>
                ` : ''}
                ${profile.goals.includes('writing') ? `
                  <button class="check-item" data-check="writing">
                    <span class="check-icon">${log.writing ? '<span style="color:#4FB08A;">✓</span>' : '<span style="color:#2C3564;">○</span>'}</span>
                    <span class="check-label ${log.writing?'done':''}">Write / journal today</span>
                    <span class="check-sub">A few honest sentences</span>
                  </button>
                ` : ''}
                ${profile.goals.includes('sleep') ? `
                  <div class="flex items-center justify-between py-2.5">
                    <div>
                      <div class="text-[15px] font-medium" style="color:#F3EEE2;">Sleep</div>
                      <div class="text-xs" style="color:#8D93B8;">${log.sleepDurationMin ? `Logged ${Math.floor(log.sleepDurationMin/60)}h ${log.sleepDurationMin%60}m last night` : 'Tracked in the Sleep tab'}</div>
                    </div>
                    ${log.sleep ? '<span style="color:#4FB08A;">✓</span>' : '<span style="color:#8D93B8;">🌙</span>'}
                  </div>
                ` : ''}
                ${profile.goals.includes('water') ? `
                  <div class="py-2.5">
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-sm font-medium" style="color:#F3EEE2;">Water — ${log.water||0} / 8 glasses</span>
                    </div>
                    <div class="water-grid">
                      ${Array.from({length:8}).map((_, i) => `
                        <button class="water-glass ${i < (log.water||0) ? 'filled' : ''}" data-glass="${i+1}"></button>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          <!-- Weekly Chart -->
          <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
            <div class="flex items-center gap-2"><span>🏆</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">This Week</h3></div>
            <div class="chart-container">
              ${weekData.map(d => `
                <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
                  <div class="chart-bar" style="height:${d.pct}%; background:#E8A33D; border-radius:6px 6px 0 0; min-height:4px; width:100%; max-width:40px;"></div>
                  <span style="font-size:0.625rem; color:#8D93B8;">${d.day}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Savings -->
          ${profile.goals.includes('savings') ? `
            <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2"><span>🐷</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">Saving for: ${profile.savingsGoalName}</h3></div>
                <span style="color:${monthlySavings>0?'#4FB08A':'#E0654B'};">${monthlySavings>0?'📈':'📉'}</span>
              </div>
              <div class="flex items-end justify-between mt-3 mb-1">
                <span class="text-2xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">${fmtMoney(savingsCurrent, profile.currency)}</span>
                <span class="text-sm" style="color:#8D93B8;">of ${fmtMoney(savingsTarget, profile.currency)}</span>
              </div>
              <div class="h-2.5 rounded-full" style="background:#1F2850;">
                <div class="h-2.5 rounded-full transition-all" style="width:${Math.min(100, (savingsCurrent/(savingsTarget||1))*100)}%; background:#E8A33D;"></div>
              </div>
              <div class="grid grid-cols-2 gap-3 mt-4">
                <div class="p-3 rounded-xl" style="background:#1F2850;">
                  <div class="text-[11px]" style="color:#8D93B8;">MONTHLY BUDGET</div>
                  <div class="text-sm font-semibold mt-0.5" style="color:${monthlySavings>=0?'#4FB08A':'#E0654B'};">${monthlySavings>=0?'+':''}${fmtMoney(monthlySavings, profile.currency)}/mo</div>
                  <div class="text-[11px] mt-0.5" style="color:#8D93B8;">${fmtMoney(profile.monthlyIncome, profile.currency)} in − ${fmtMoney(profile.monthlyExpenses, profile.currency)} out</div>
                </div>
                <div class="p-3 rounded-xl" style="background:#1F2850;">
                  <div class="text-[11px]" style="color:#8D93B8;">TIME TO GOAL</div>
                  <div class="text-sm font-semibold mt-0.5" style="color:#F3EEE2;">${monthlySavings<=0?'Adjust budget':remaining===0?'Reached! 🎉':`${monthsRemaining} mo · ${projectedDate}`}</div>
                </div>
              </div>
              <div class="mt-4">
                <div class="text-xs mb-2" style="color:#8D93B8;">${loggedThisMonth ? `You've logged ${fmtMoney(profile.savingsLog[curMonth], profile.currency)} for ${monthLabel(curMonth)}` : `Log this month's savings (${monthLabel(curMonth)})`}</div>
                <div class="flex gap-2">
                  <button id="savings-add-budget" class="px-4 py-2 rounded-xl btn-gold" ${monthlySavings<=0?'disabled':''}><span>💳</span>Add budgeted ${fmtMoney(monthlySavings, profile.currency)}</button>

              <span style="color:#8D93B8; transition:transform 0.2s;" id="roadmap-arrow">▶</span>
            </button>
            <div class="h-2 rounded-full mt-3 mb-1" style="background:#1F2850;">

    /* ---------- SLEEP TAB ---------- */
    function renderSleepTab(profile, logs) {
      const today = todayKey();
      const log = logs[today] || {};
      const isAsleep = profile.sleepStatus === 'asleep';
      const targetHours = profile.sleepTargetHours || 8;
      const targetMin = targetHours * 60;
      const hm = (min) => `${Math.floor(min/60)}h ${min%60}m`;
      const elapsedMin = isAsleep ? Math.max(0, Math.round((Date.now() - new Date(profile.sleepStartedAt).getTime()) / 60000)) : 0;
      const sessions = profile.sleepSessions || [];
      const recent = [...sessions].slice(-7).reverse();
      const avgMin = recent.length ? Math.round(recent.reduce((a,s) => a + s.durationMin, 0) / recent.length) : 0;
      const chartData = sessions.slice(-7).map(s => ({ day: dayLabel(s.date), hours: +(s.durationMin/60).toFixed(1) }));

      let html = `
        <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
          <div class="flex flex-col items-center text-center gap-3 py-4">
            ${isAsleep ? '<span style="font-size:40px;">🌙</span>' : '<span style="font-size:40px;">☀️</span>'}
            ${isAsleep ? `
              <div class="text-sm" style="color:#8D93B8;">Sleeping since ${new Date(profile.sleepStartedAt).toLocaleTimeString(undefined, {hour:'numeric',minute:'2-digit'})}</div>
              <div class="text-3xl font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">${hm(elapsedMin)}</div>
              <button id="sleep-wake" class="px-6 py-3 rounded-xl btn-gold font-semibold"><span>☀️</span>I Just Woke Up</button>
            ` : `
              <div class="text-sm" style="color:#8D93B8;">Ready to wind down?</div>
              <button id="sleep-start" class="px-6 py-3 rounded-xl btn-gold font-semibold"><span>🌙</span>I'm Going to Sleep</button>
            `}
          </div>
        </div>
        <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
          <div class="flex items-center gap-2"><span>🎯</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">Sleep Target</h3></div>
          <div class="flex items-center gap-3 mt-2">
            <input id="sleep-target" type="number" min="4" max="12" value="${targetHours}" class="input-dark" style="width:80px;" />
            <span class="text-sm" style="color:#8D93B8;">hours / night</span>
          </div>
        </div>
        ${chartData.length > 0 ? `
          <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
            <div class="flex items-center gap-2"><span>🏆</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">Last 7 Nights</h3></div>
            <div class="chart-container" style="height:140px;">
              ${chartData.map(d => `
                <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
                  <div class="chart-bar" style="height:${Math.min(100, (d.hours/12)*100)}%; background:#E8A33D; border-radius:6px 6px 0 0; min-height:4px; width:100%; max-width:40px;"></div>
                  <span style="font-size:0.625rem; color:#8D93B8;">${d.day}</span>
                </div>
              `).join('')}
            </div>
            <div class="text-xs mt-2" style="color:#8D93B8;">Average: ${hm(avgMin)} · Target: ${targetHours}h</div>
          </div>
        ` : ''}
        ${recent.length > 0 ? `
          <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
            <div class="flex items-center gap-2"><span>🌙</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">History</h3></div>
            <div class="flex flex-col divide-y mt-2" style="border-color:#2C3564;">
              ${recent.map(s => `
                <div class="flex items-center justify-between py-2.5 text-sm">
                  <span style="color:#F3EEE2;">${monthLabel(s.date.slice(0,7))} ${s.date.slice(8,10)}</span>
                  <span style="color:#8D93B8;" class="hidden sm:inline">${new Date(s.start).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})} → ${new Date(s.end).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</span>
                  <span style="color:${s.durationMin>=targetMin?'#4FB08A':'#E8A33D'}; font-weight:600;">${hm(s.durationMin)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : `
          <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
            <p class="text-sm text-center py-4" style="color:#8D93B8;">No sleep logged yet. Tap "I'm Going to Sleep" tonight, then "I Just Woke Up" tomorrow to start your history.</p>
          </div>
        `}
      `;
      return html;
    }

    /* ---------- LOOKSMAXING TAB ---------- */
    function renderLooksTab(profile, logs) {
      const today = todayKey();
      const log = logs[today] || {};
      const looks = log.looks || {};
      const done = LOOKS_TASKS.filter(t => looks[t.id]).length;
      const pct = done / LOOKS_TASKS.length;
      // weekly data
      const weekData = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = todayKey(d);
        const l = logs[key]?.looks || {};
        const c = LOOKS_TASKS.filter(t => l[t.id]).length;
        weekData.push({ day: dayLabel(key), pct: Math.round((c / LOOKS_TASKS.length) * 100) });
      }

      let html = `
        <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
          <div class="flex items-center gap-3">
            <span class="text-2xl">✨</span>
            <div>
              <div class="text-lg font-bold" style="font-family:'Fraunces',serif; color:#F3EEE2;">Looksmaxing</div>
              <div class="text-xs" style="color:#8D93B8;">The fundamentals: skin, hair, posture, fitness, hygiene, confidence — done consistently.</div>
            </div>
          </div>
          <div class="h-2.5 rounded-full mt-4" style="background:#1F2850;">
            <div class="h-2.5 rounded-full transition-all" style="width:${pct*100}%; background:#E8A33D;"></div>
          </div>
          <div class="text-xs mt-1.5" style="color:#8D93B8;">${done} / ${LOOKS_TASKS.length} done today</div>
        </div>
        <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
          <div class="flex items-center gap-2"><span>✅</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">Today's Checklist</h3></div>
          <div class="flex flex-col divide-y mt-1" style="border-color:#2C3564;">
            ${LOOKS_TASKS.map(t => `
              <button class="looks-item check-item" data-looks="${t.id}">
                <span class="check-icon">${looks[t.id] ? '<span style="color:#4FB08A;">✓</span>' : '<span style="color:#2C3564;">○</span>'}</span>
                <span class="check-label ${looks[t.id]?'done':''}">${t.label}</span>
              </button>
            `).join('')}
          </div>
        </div>
        <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
          <div class="flex items-center gap-2"><span>🏆</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">This Week</h3></div>
          <div class="chart-container">
            ${weekData.map(d => `
              <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
                <div class="chart-bar" style="height:${d.pct}%; background:#E8A33D; border-radius:6px 6px 0 0; min-height:4px; width:100%; max-width:40px;"></div>
                <span style="font-size:0.625rem; color:#8D93B8;">${d.day}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="rounded-2xl p-5" style="background:#171E3E; border:1px solid #2C3564;">
          <div class="flex items-center gap-2"><span>⭐</span><h3 class="font-semibold text-sm tracking-wide" style="color:#F3EEE2;">Tips</h3></div>
          <div class="flex flex-col gap-2.5 mt-2">
            ${LOOKS_TIPS.map(tip => `
              <div class="flex items-start gap-2.5">
                <div class="mt-1.5 w-1.5 h-1.5 rounded-full flex-shrink-0" style="background:#E8A33D;"></div>
                <p class="text-sm" style="color:#8D93B8;">${tip}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      return html;
    }

                <select id="settings-career" class="input-dark">
                  ${Object.keys(CAREERS).concat([profile.careerGoal]).filter((v,i,a)=>a.indexOf(v)===i).map(c => `<option value="${c}" ${c===profile.careerGoal?'selected':''}>${c}</option>`).join('')}
                </select>
              </div>
              ${profile.goals.includes('savings') ? `

                <div class="flex flex-col gap-1.5"><label class="text-xs" style="color:#8D93B8;">Goal Name</label><input id="settings-savings-name" class="input-dark" value="${profile.savingsGoalName}" /></div>
                <div class="flex gap-3">
                  <div class="flex-1"><label class="text-xs" style="color:#8D93B8;">Target</label><input id="settings-savings-target" type="number" class="input-dark" value="${profile.savingsTarget}" /></div>
                  <div class="flex-1"><label class="text-xs" style="color:#8D93B8;">Current</label><input id="settings-savings-current" type="number" class="input-dark" value="${profile.savingsCurrent}" /></div>

                <div class="flex gap-3">
                  <div class="flex-1"><label class="text-xs" style="color:#8D93B8;">Monthly Income</label><input id="settings-income" type="number" class="input-dark" value="${profile.monthlyIncome}" /></div>
                  <div class="flex-1"><label class="text-xs" style="color:#8D93B8;">Monthly Expenses</label><input id="settings-expenses" type="number" class="input-dark" value="${profile.monthlyExpenses}" /></div>

                  <label class="text-xs" style="color:#8D93B8;">Currency</label>
                  <select id="settings-currency" class="input-dark">
                    <option value="USD" ${profile.currency==='USD'?'selected':''}>USD ($)</option>
                    <option value="EUR" ${profile.currency==='EUR'?'selected':''}>EUR (€)</option>
                    <option value="GBP" ${profile.currency==='GBP'?'selected':''}>GBP (£)</option>
                    <option value="PKR" ${profile.currency==='PKR'?'selected':''}>PKR (₨)</option>

    /* ---------- DASHBOARD EVENTS ---------- */
    function attachDashboardEvents(profile, logs) {
      // Tab switching
      const tabs = document.querySelectorAll('.tab-btn');
      const tabContents = {
        home: document.getElementById('home-tab'),
        sleep: document.getElementById('sleep-tab'),
        looks: document.getElementById('looks-tab')
      };
      tabs.forEach(btn => {
        btn.addEventListener('click', function() {
          const tab = this.dataset.tab;
          tabs.forEach(b => { b.classList.remove('active'); b.classList.add('inactive'); });
          this.classList.add('active');
          this.classList.remove('inactive');
          Object.keys(tabContents).forEach(key => {
            if (tabContents[key]) tabContents[key].style.display = key === tab ? 'flex' : 'none';
          });
        });
      });

      // Habit reset
      const resetBtn = document.getElementById('habit-reset');
      if (resetBtn) resetBtn.addEventListener('click', () => {
        profile.lastRelapseDate = todayKey();
        updateProfile(profile);
      });

      // Spiritual (if not prayers)
      const spiritualToggle = document.getElementById('spiritual-toggle');
      if (spiritualToggle) spiritualToggle.addEventListener('click', () => {
        const today = todayKey();
        const log = logs[today] || {};
        log.spiritual = !log.spiritual;
        logs[today] = log;
        updateLogs(logs);
      });

      // Prayer buttons
      document.querySelectorAll('.prayer-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const id = this.dataset.prayer;
          const today = todayKey();
          const log = logs[today] || {};
          if (!log.prayers) log.prayers = {};
          log.prayers[id] = !log.prayers[id];
          logs[today] = log;
          updateLogs(logs);
        });
      });

      // Exercise inc/dec
      const exerciseInc = document.querySelector('.exercise-inc');
      const exerciseDec = document.querySelector('.exercise-dec');
      if (exerciseInc) exerciseInc.addEventListener('click', () => {
        const today = todayKey();
        const log = logs[today] || {};
        const c = (log.exerciseCount || 0) + 5;
        log.exerciseCount = c;
        log.exerciseDone = c >= profile.pushupTarget;
        logs[today] = log;
        updateLogs(logs);
      });
      if (exerciseDec) exerciseDec.addEventListener('click', () => {
        const today = todayKey();
        const log = logs[today] || {};
        log.exerciseCount = Math.max(0, (log.exerciseCount || 0) - 5);
        log.exerciseDone = log.exerciseCount >= profile.pushupTarget;
        logs[today] = log;
        updateLogs(logs);
      });

      // Check items (reading, writing)
      document.querySelectorAll('[data-check]').forEach(el => {
        el.addEventListener('click', function() {
          const key = this.dataset.check;
          const today = todayKey();
          const log = logs[today] || {};
          log[key] = !log[key];
          logs[today] = log;
          updateLogs(logs);
        });
      });

      // Water glasses
      document.querySelectorAll('.water-glass').forEach(el => {
        el.addEventListener('click', function() {
          const glassNum = parseInt(this.dataset.glass);
          const today = todayKey();
          const log = logs[today] || {};
          // Toggle: if clicked glass is current or lower, set to clicked; else set to clicked
          const current = log.water || 0;
          if (glassNum === current) {
            log.water = glassNum - 1; // uncheck last one
          } else {
            log.water = glassNum;
          }
          logs[today] = log;
          updateLogs(logs);
        });
      });

      // Sleep start/wake
      const sleepStart = document.getElementById('sleep-start');
      if (sleepStart) sleepStart.addEventListener('click', () => {
        profile.sleepStatus = 'asleep';
        profile.sleepStartedAt = new Date().toISOString();
        updateProfile(profile);
      });
      const sleepWake = document.getElementById('sleep-wake');
      if (sleepWake) sleepWake.addEventListener('click', () => {
        if (profile.sleepStartedAt) {
          const start = new Date(profile.sleepStartedAt);
          const end = new Date();
          const durationMin = Math.max(1, Math.round((end - start) / 60000));
          const wakeDate = todayKey(end);
          const sessions = [...(profile.sleepSessions || []), { start: start.toISOString(), end: end.toISOString(), durationMin, date: wakeDate }].slice(-30);
          profile.sleepStatus = 'awake';
          profile.sleepStartedAt = null;
          profile.sleepSessions = sessions;
          const targetMin = (profile.sleepTargetHours || 8) * 60;
          const dayLog = logs[wakeDate] || {};
          dayLog.sleepDurationMin = durationMin;
          dayLog.sleep = durationMin >= targetMin;
          logs[wakeDate] = dayLog;
          updateProfile(profile);
          updateLogs(logs);
        }
      });

      // Sleep target
      const sleepTarget = document.getElementById('sleep-target');
      if (sleepTarget) sleepTarget.addEventListener('change', function() {
        profile.sleepTargetHours = Number(this.value) || 8;
        updateProfile(profile);
      });

      // Looks items
      document.querySelectorAll('.looks-item').forEach(el => {
        el.addEventListener('click', function() {
          const id = this.dataset.looks;
          const today = todayKey();
          const log = logs[today] || {};
          if (!log.looks) log.looks = {};
          log.looks[id] = !log.looks[id];
          logs[today] = log;
          updateLogs(logs);
        });
      });

      // Savings add budget
      const savingsBudget = document.getElementById('savings-add-budget');
      if (savingsBudget) savingsBudget.addEventListener('click', () => {
        const monthlySavings = (profile.monthlyIncome || 0) - (profile.monthlyExpenses || 0);
        if (monthlySavings <= 0) return;
        const curMonth = monthKey();
        const savingsCurrent = profile.savingsCurrent || 0;
        profile.savingsCurrent = savingsCurrent + monthlySavings;
        if (!profile.savingsLog) profile.savingsLog = {};
        profile.savingsLog[curMonth] = (profile.savingsLog[curMonth] || 0) + monthlySavings;
        updateProfile(profile);
      });
      const savingsCustom = document.getElementById('savings-custom');
      const savingsAddCustom = document.getElementById('savings-add-custom');
      if (savingsAddCustom && savingsCustom) {
        savingsAddCustom.addEventListener('click', () => {
          const amount = Number(savingsCustom.value);
          if (!amount || amount <= 0) return;
          const curMonth = monthKey();
          profile.savingsCurrent = (profile.savingsCurrent || 0) + amount;
          if (!profile.savingsLog) profile.savingsLog = {};
          profile.savingsLog[curMonth] = (profile.savingsLog[curMonth] || 0) + amount;
          savingsCustom.value = '';
          updateProfile(profile);
        });
      }

      // Roadmap toggle
      const roadmapToggle = document.getElementById('roadmap-toggle');
      const roadmapContent = document.getElementById('roadmap-content');
      const roadmapArrow = document.getElementById('roadmap-arrow');
      if (roadmapToggle && roadmapContent && roadmapArrow) {
        roadmapToggle.addEventListener('click', () => {
          if (roadmapContent.style.display === 'none') {
            roadmapContent.style.display = 'block';
            roadmapArrow.style.transform = 'rotate(90deg)';
          } else {
            roadmapContent.style.display = 'none';
            roadmapArrow.style.transform = 'rotate(0deg)';
          }
        });
      }
      // Roadmap items
      document.querySelectorAll('.roadmap-item').forEach(el => {
        el.addEventListener('click', function() {
          const key = this.dataset.key;
          if (!profile.roadmapProgress) profile.roadmapProgress = {};
          profile.roadmapProgress[key] = !profile.roadmapProgress[key];
          updateProfile(profile);
        });
      });

      // Settings toggle and modal
      const settingsToggle = document.getElementById('settings-toggle');
      const settingsModal = document.getElementById('settings-modal');
      if (settingsToggle && settingsModal) {
        settingsToggle.addEventListener('click', () => {
          settingsModal.style.display = 'flex';
          // Pre-fill current values
          document.getElementById('settings-name').value = profile.name;
          document.getElementById('settings-age').value = profile.age;
          document.getElementById('settings-weight').value = profile.weight;
          document.getElementById('settings-pushups').value = profile.pushupTarget;
          document.getElementById('settings-habit').value = profile.habitName;
          document.getElementById('settings-career').value = profile.careerGoal;
          if (profile.goals.includes('savings')) {
            document.getElementById('settings-savings-name').value = profile.savingsGoalName || '';
            document.getElementById('settings-savings-target').value = profile.savingsTarget || '';
            document.getElementById('settings-savings-current').value = profile.savingsCurrent || '';
            document.getElementById('settings-income').value = profile.monthlyIncome || '';
            document.getElementById('settings-expenses').value = profile.monthlyExpenses || '';
            document.getElementById('settings-currency').value = profile.currency || 'USD';
          }
        });
      }
      const closeSettings = document.getElementById('settings-close');
      if (closeSettings) closeSettings.addEventListener('click', () => { settingsModal.style.display = 'none'; });
      const cancelSettings = document.getElementById('settings-cancel');
      if (cancelSettings) cancelSettings.addEventListener('click', () => { settingsModal.style.display = 'none'; });
      const saveSettings = document.getElementById('settings-save');
      if (saveSettings) {
        saveSettings.addEventListener('click', () => {
          profile.name = document.getElementById('settings-name').value.trim() || profile.name;
          profile.age = Number(document.getElementById('settings-age').value) || profile.age;
          profile.weight = Number(document.getElementById('settings-weight').value) || profile.weight;
          profile.pushupTarget = Number(document.getElementById('settings-pushups').value) || profile.pushupTarget;
          profile.habitName = document.getElementById('settings-habit').value.trim() || profile.habitName;
          profile.careerGoal = document.getElementById('settings-career').value || profile.careerGoal;
          if (profile.goals.includes('savings')) {
            profile.savingsGoalName = document.getElementById('settings-savings-name').value.trim();
            profile.savingsTarget = Number(document.getElementById('settings-savings-target').value) || 0;
            profile.savingsCurrent = Number(document.getElementById('settings-savings-current').value) || 0;
            profile.monthlyIncome = Number(document.getElementById('settings-income').value) || 0;
            profile.monthlyExpenses = Number(document.getElementById('settings-expenses').value) || 0;
            profile.currency = document.getElementById('settings-currency').value || 'USD';
          }
          updateProfile(profile);
          settingsModal.style.display = 'none';
        });
      }
    }

    /* ---------- INIT ---------- */
    render();
  </script>
</body>
</html>
